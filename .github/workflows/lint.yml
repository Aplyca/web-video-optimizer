name: lint

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: for f in optimize.sh lib/*.sh; do bash -n "$f"; done

      # Lint through the entry point so variables shared across lib/ files resolve
      - name: ShellCheck
        run: shellcheck -x -s bash -S warning optimize.sh
